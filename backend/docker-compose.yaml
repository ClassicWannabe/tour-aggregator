services:
  app:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT}/${DB_NAME}?schema=public"
    ports:
      - '${APP_PORT}:${APP_PORT}'
    depends_on:
      - postgres
      - minio
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - /app/node_modules

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT}:5432'

  # Object storage
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      while ! mc alias set myminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO to be ready...'
        sleep 5
      done
      
      mc mb myminio/app-bucket || echo 'Bucket already exists'
      "

volumes:
  postgres_data:
  minio_data:
